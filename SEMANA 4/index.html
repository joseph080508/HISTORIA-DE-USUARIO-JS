<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Productos</title>
</head>
<body>

    <h1>Gestión de Productos</h1>

    <!-- Formulario -->
    <form id="productForm">
        <input
            type="text"
            id="productName"
            placeholder="Nombre del producto"
        >

        <input
            type="number"
            id="productPrice"
            placeholder="Precio"
        >

        <button type="submit">
            Agregar
        </button>
    </form>

    <!-- Mensajes -->
    <p id="message"></p>

    <!-- Lista -->
    <ul id="productList"></ul>

    <!-- Botón sincronizar -->
    <button id="syncBtn">
        Sincronizar API
    </button>

    <script src="app.js"></script>

</body>
</html>
